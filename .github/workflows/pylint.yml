name: Pylint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pylint-fastapi
      
      - name: Analysing the code with pylint
        working-directory: ./Backend
        run: |
          # Find all Python files and run pylint
          python_files=$(find . -name "*.py" -not -path "*/env/*" -not -path "*/__pycache__/*" -not -path "*/node_modules/*")
          if [ -z "$python_files" ]; then
            echo "No Python files found to lint"
            exit 0
          fi
          # Use .pylintrc if it exists, otherwise use command line options
          if [ -f .pylintrc ]; then
            echo "$python_files" | xargs pylint --rcfile=.pylintrc
          else
            echo "$python_files" | xargs pylint \
              --disable=C0111 \
              --disable=C0103 \
              --disable=R0903 \
              --disable=R0913 \
              --max-line-length=120 \
              --output-format=text
          fi
